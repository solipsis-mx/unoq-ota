[project]
name = "unoq-ota"
version = "0.1.0"
description = "Over-the-air firmware updates for the Arduino UNO Q's STM32"
requires-python = ">=3.9"
dependencies = ["requests>=2.25", "cryptography>=3.4"]

[project.optional-dependencies]
aws = ["awsiotsdk>=1.11"]
dev = ["pytest>=7.0"]

[project.scripts]
unoq-ota = "unoq_ota.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
